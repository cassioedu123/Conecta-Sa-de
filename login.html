<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Conecta Saúde</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 88C50 88 12 62 12 36C12 22.7 22.7 12 36 12C43.5 12 50 16 50 16C50 16 56.5 12 64 12C77.3 12 88 22.7 88 36C88 62 50 88 50 88Z" stroke="#e66700" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 46H36L43 30L55 62L64 42L70 46H78" stroke="#e66700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <div class="header-actions">
        <div class="user-profile-icon" title="Usuário">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <button class="mobile-menu-toggle" aria-label="Abrir Menu">☰</button>
      </div>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 88C50 88 12 62 12 36C12 22.7 22.7 12 36 12C43.5 12 50 16 50 16C50 16 56.5 12 64 12C77.3 12 88 22.7 88 36C88 62 50 88 50 88Z" stroke="#e66700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 46H36L43 30L55 62L64 42L70 46H78" stroke="#e66700" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Conecta<br>Saúde</h1>
      </div>

      <div id="loginAlert" class="alert-message"></div>

      <form id="loginForm">
        <div class="form-group">
          <input type="text" id="userInput" class="form-input" placeholder="cpf ou e-mail @gmail.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 0.4rem;">
          <input type="password" id="passwordInput" class="form-input" placeholder="Senha" required>
        </div>

        <div style="text-align: right; margin-bottom: 1.5rem;">
          <a href="esqueci-senha.html" class="auth-link" style="font-size: 0.85rem;">Esqueci minha senha?</a>
        </div>

        <div style="text-align: left;">
          <button type="submit" class="btn btn-orange" style="padding: 0.65rem 2.5rem;">Login</button>
        </div>
      </form>

      <div class="auth-links" style="margin-top: 1.8rem; justify-content: center;">
        <span>Não tem uma conta? <a href="cadastro.html" class="auth-link" style="color: var(--primary-teal); font-weight: 600;">Criar conta</a></span>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
