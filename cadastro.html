<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Conecta Saúde</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 88C50 88 12 62 12 36C12 22.7 22.7 12 36 12C43.5 12 50 16 50 16C50 16 56.5 12 64 12C77.3 12 88 22.7 88 36C88 62 50 88 50 88Z" stroke="#e66700" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 46H36L43 30L55 62L64 42L70 46H78" stroke="#e66700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div></div>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 88C50 88 12 62 12 36C12 22.7 22.7 12 36 12C43.5 12 50 16 50 16C50 16 56.5 12 64 12C77.3 12 88 22.7 88 36C88 62 50 88 50 88Z" stroke="#e66700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 46H36L43 30L55 62L64 42L70 46H78" stroke="#e66700" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Conecta<br>Saúde</h1>
      </div>

      <div id="cadastroAlert" class="alert-message"></div>

      <form id="cadastroForm">
        <div class="form-group">
          <input type="text" id="nome" class="form-input" placeholder="Nome Completo" required>
        </div>

        <div class="form-group">
          <input type="email" id="email" class="form-input" placeholder="Email" required>
        </div>

        <div class="form-group">
          <input type="text" id="cpf" class="form-input" placeholder="CPF" maxlength="14" required>
        </div>

        <div class="form-group">
          <input type="password" id="senha" class="form-input" placeholder="Senha" required>
        </div>

        <div class="form-group">
          <input type="password" id="confirmSenha" class="form-input" placeholder="Confirmar senha" required>
        </div>

        <div class="form-group">
          <select id="tipo" class="form-select" required>
            <option value="" disabled selected>Tipo da conta</option>
            <option value="paciente">Paciente</option>
            <option value="profissional">Profissional de Saúde (Médico)</option>
          </select>
        </div>

        <div style="text-align: left; margin-top: 1.5rem;">
          <button type="submit" class="btn btn-orange" style="padding: 0.65rem 2.5rem;">Avançar</button>
        </div>
      </form>

      <div class="auth-links" style="margin-top: 1.5rem; justify-content: center;">
        <span>Já possui uma conta? <a href="login.html" class="auth-link" style="color: var(--primary-teal); font-weight: 600;">Faça Login</a></span>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
